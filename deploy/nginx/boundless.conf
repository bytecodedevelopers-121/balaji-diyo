# Nginx site config for the Boundless stack — one VM, three subdomains,
# proxying to the PM2-managed Node processes + serving the admin build
# as static files.
#
# Replace every "boundlessadventure.com" below with the real domain if
# it differs, then:
#
#   sudo cp deploy/nginx/boundless.conf /etc/nginx/sites-available/boundless
#   sudo ln -s /etc/nginx/sites-available/boundless /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d boundlessadventure.com -d www.boundlessadventure.com \
#                        -d api.boundlessadventure.com -d admin.boundlessadventure.com
#
# certbot rewrites this file in place to add the HTTPS server blocks and
# the HTTP->HTTPS redirect — don't hand-add TLS directives yourself.
#
# All three DNS records (apex/www, api, admin) must point at this VM's
# IP in Cloudflare (DNS-only/grey-cloud) before requesting certs for them
# — if boundlessadventure.com/www were previously pointed at Vercel,
# update those records first and remove/ignore the domain in the Vercel
# project so the two don't fight over it.

# ── Image + static caching for the Next.js site ────────────────────────────
# Optimized images from /_next/image are cached here so repeat requests
# never reach Node/sharp. Create the dir once:
#   sudo mkdir -p /var/cache/nginx/next_images && sudo chown www-data /var/cache/nginx/next_images
# (this directive must sit at http level — sites-enabled files are
# included there, so top-level placement in this file is fine.)
proxy_cache_path /var/cache/nginx/next_images levels=1:2 keys_zone=next_images:20m
                 max_size=2g inactive=30d use_temp_path=off;

# ── Public site → Next.js (PM2, port 3000) ─────────────────────────────────
server {
    listen 80;
    server_name boundlessadventure.com www.boundlessadventure.com;

    # Optimized images: cache at Nginx so warm hits skip Node entirely.
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache next_images;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;   # one encode per image/size on a cold cache
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Hashed build assets never change — cache aggressively.
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSR pages that depend on large/uncached upstream API responses
        # (see getTrips() in frontend/src/features/trips/api/get-trips.ts —
        # its perPage=100 fetch is ~8.5MB, over Next's 2MB data-cache
        # limit, so it never gets cached and re-runs on every visit) can
        # take longer than Nginx's 60s default. This is a mitigation, not
        # a fix — the real fix is trimming that payload.
        proxy_connect_timeout 90s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}

# ── API → Express/Prisma backend (PM2, port 5000) ──────────────────────────
server {
    listen 80;
    server_name api.boundlessadventure.com;

    # Matches the backend's own multer limit (100MB max upload — see
    # backend/src/config/multer.ts) plus headroom.
    client_max_body_size 110M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}

# ── Admin panel → static Vite build (no Node process) ──────────────────────
server {
    listen 80;
    server_name admin.boundlessadventure.com;

    root /opt/boundless/frontend-admin/dist;
    index index.html;

    # Second lock beyond the app's own auth — this is an internal tool.
    # Generate with: sudo htpasswd -c /etc/nginx/.htpasswd-admin <username>
    auth_basic "Boundless Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-admin;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
